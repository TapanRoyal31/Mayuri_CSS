<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #212121;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    h1 {
      position: relative;
    }
    
    h1::after {
      content: " ";
      height: 5px;
      width: 100px;
      position: absolute;
      bottom: -5px;
      left: 5px;
      background-image: linear-gradient(45deg, red, blue);
      animation: fade 1s ease 1;
    }
    @keyframes fade {
      from {
        width: 0px;
      }
      to {
        width: 100px;
      }
    }
  </style>
  <body>
    <h1>CSS Heading</h1>
  </body>
</html>
